<div class="area-selector" *ngIf="!idDemanda && !readonly">
    <div class="flex align-items-center gap-2">
        <label for="idArea" class="flex-shrink-0" style="width: 100px;">Área</label>
        <p-dropdown [options]="listArea" optionLabel="nombre" optionValue="id" placeholder="Seleccione área"
            [formControl]="idArea" class="flex-grow-1"></p-dropdown>
    </div>
    <div class="mt-3 mb-3">
        <p-button type="button" (click)="addAreaToWorkflow()">Agregar área</p-button>
    </div>
</div>


<div #ref class="diagram-container" id="bpmn-container" [class.solo-lectura]="readonly"></div>

<div class="diagram-actions flex gap-3">
    <p-button type="button" label="Descargar BPMN" icon="pi pi-download" (click)="exportDiagram()"></p-button>
    <p-button type="button" label="Descargar imagen" icon="pi pi-image" severity="secondary" [outlined]="true"
        (click)="exportImagen()"></p-button>
</div>
