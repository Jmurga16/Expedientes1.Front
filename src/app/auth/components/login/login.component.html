<app-loading></app-loading>
<div class="login-background">
    <section class="login-intro" aria-hidden="true">
        <div class="intro-brand"><img src="assets/images/nexo-logo.svg" alt=""><span>NEXO</span></div>
        <div>
            <p class="eyebrow">GESTIÓN DOCUMENTAL</p>
            <h1>Todo expediente,<br><em>en su lugar.</em></h1>
            <p class="intro-copy">Centraliza la gestión, el seguimiento y los flujos de trabajo de tu organización.</p>
        </div>
        <div class="intro-footer"><i class="pi pi-shield"></i> Acceso seguro para equipos autorizados</div>
    </section>
    <p-panel [style]="{'width': '25em'}" class="login-panel">
        <div class="login-form">
            <div class="mobile-brand"><img src="assets/images/nexo-logo.svg" alt="Logo de NEXO"><span>NEXO</span></div>
            <p class="eyebrow">BIENVENIDO</p>
            <h2>Inicia sesión</h2>
            <p class="form-subtitle">Ingresa tus datos para continuar.</p>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="p-fluid">
                    <div class="p-field">
                        <label for="username">Correo electrónico</label>
                        <span class="p-input-icon-left"><i class="pi pi-envelope"></i><input id="username" type="text" pInputText formControlName="username" placeholder="nombre@organizacion.pe" autocomplete="username" /></span>
                    </div>
                    <div class="p-field">
                        <label for="password">Contraseña</label>
                        <span class="p-input-icon-left"><i class="pi pi-lock"></i><input id="password" type="password" pInputText formControlName="password" placeholder="Tu contraseña" autocomplete="current-password" /></span>
                    </div>
                    <div class="p-field"><button pButton type="submit" label="Ingresar a NEXO" icon="pi pi-arrow-right" iconPos="right" [disabled]="!loginForm.valid"></button></div>
                </div>
            </form>
            <div class="register-link"><p>¿No tienes una cuenta? <a routerLink="../register">Regístrate aquí</a></p></div>
        </div>
    </p-panel>
</div>
