<div class="layout-topbar">
    <a class="brand" routerLink="/admin/home" aria-label="TRAZA, gestión de expedientes y seguimiento de procesos">
        <img src="assets/images/traza-logo.svg" alt="Logo de TRAZA">
        <span class="brand-name">TRAZA</span>
        <span class="brand-divider">|</span>
        <span class="brand-section">{{ section }}</span>
    </a>
    <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()"><i class="pi pi-bars"></i></button>
    <div class="layout-topbar-menu">
        <button class="p-link layout-topbar-button" (click)="op.toggle($event)" aria-label="Abrir menú de sesión"><i class="pi pi-ellipsis-v"></i></button>
        <p-overlayPanel #op><a (click)="logout()">Cerrar sesión</a></p-overlayPanel>
    </div>
</div>
